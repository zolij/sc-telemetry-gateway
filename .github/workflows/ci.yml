name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      RUN_PROXY_TESTS: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore tests/ScTelemetryGateway.Tests --locked-mode
      - run: dotnet test tests/ScTelemetryGateway.Tests --no-restore --configuration Release
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test MFD browser logic
        run: node --test tests/ScTelemetryGateway.Tests/MfdPresentationTests.cjs tests/ScTelemetryGateway.Tests/MfdTriggerTests.cjs tests/ScTelemetryGateway.Tests/MfdFocusTests.cjs tests/ScTelemetryGateway.Tests/MfdWorkspaceTests.cjs
      - name: Install usage service dependencies
        if: runner.os == 'Linux'
        working-directory: usage-service
        run: npm ci
      - name: Test usage service
        if: runner.os == 'Linux'
        working-directory: usage-service
        run: npm test
      - name: Build usage service
        if: runner.os == 'Linux'
        working-directory: usage-service
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --dry-run --outdir /tmp/sc-usage-worker-build
      - if: runner.os == 'Windows'
        run: dotnet publish src/ScTelemetryGateway.Windows --configuration Release --runtime win-x64 --self-contained true --output artifacts/win-x64 -p:RestoreLockedMode=true
      - name: Smoke test self-contained Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $startedAt = Get-Date
          $process = Start-Process ./artifacts/win-x64/StarCitizenTelemetryGateway.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(20000)) {
            Stop-Process -Id $process.Id
            throw 'Windows application smoke test timed out.'
          }
          if ($process.ExitCode -ne 0) {
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1026, 1000; StartTime = $startedAt } -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.Message }
            throw "Windows application exited with $($process.ExitCode)."
          }
      - name: Package portable Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/star-citizen-telemetry-gateway-win-x64.zip
          (Get-FileHash artifacts/star-citizen-telemetry-gateway-win-x64.zip -Algorithm SHA256).Hash |
            Set-Content artifacts/star-citizen-telemetry-gateway-win-x64.zip.sha256
      - name: Build unsigned preview installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          ./build/Pack.ps1 -Version $version -PublishDirectory artifacts/win-x64 -SkipPublish
      - name: Verify install, approved upgrade and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem artifacts/installer/*Setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one installer.' }
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          ./build/Test-Installer.ps1 -Installer $installer[0].FullName -Version $version
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: unsigned-preview-installer
          path: artifacts/installer/
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: star-citizen-telemetry-gateway-win-x64
          path: |
            artifacts/star-citizen-telemetry-gateway-win-x64.zip
            artifacts/star-citizen-telemetry-gateway-win-x64.zip.sha256
